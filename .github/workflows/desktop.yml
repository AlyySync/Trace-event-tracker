name: Build and verify desktop apps
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            bundles: appimage,deb
          - os: windows-latest
            target: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxss-dev patchelf xdg-utils xvfb xauth
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && 'installers' || 'checks' }}
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
            src-tauri/core -> target
      - run: npm ci
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm run test:tracking
      - run: npm run test:rust -- --locked
      - run: npm run build
      - name: Check native desktop application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Package desktop application
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: npm run desktop:build -- --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Prepare installers and installation guide
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: node scripts/collect-installers.mjs ${{ matrix.target }}
      - name: Verify Ubuntu package installation
        if: runner.os == 'Linux' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          sudo apt-get install -y ./release/installers/*.deb
          dpkg-query -W trace
          test -x /usr/bin/trace-desktop
          test -f /usr/share/doc/trace/INSTALL.md
          python3 - <<'PY'
          import subprocess
          libraries = subprocess.check_output(['ldd', '/usr/bin/trace-desktop'], text=True)
          print(libraries)
          assert 'not found' not in libraries, 'Missing runtime library'
          PY
          set +e
          dbus-run-session -- xvfb-run -a timeout 10s /usr/bin/trace-desktop
          result=$?
          set -e
          test "$result" -eq 124
      - name: Verify Windows installer
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/installers/*-setup.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'trace-installer-test'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $installDir 'trace-desktop.exe'))) { throw 'Installed application is missing' }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: Trace-${{ matrix.target }}
          if-no-files-found: error
          path: release/installers/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Trace-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f installers/INSTALL.md
          test -n "$(find installers -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find installers -maxdepth 1 -name '*-setup.exe' -print -quit)"
          (cd installers && sha256sum -c SHA256SUMS-linux.txt && sha256sum -c SHA256SUMS-windows.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Trace $GITHUB_REF_NAME" --generate-notes
          fi
