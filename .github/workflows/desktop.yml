name: Build desktop apps
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run test:tracking
      - run: npx tsc --noEmit
      - run: npm run package:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Trace-${{ matrix.target }}
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.exe
